name: Release compat (npm latest vs dsh@latest)

# Daily check that the PUBLISHED npm package (@dsh-feishu/dsh-feishu@latest)
# stays installable and bootable against the dsh @latest dist-tag — the
# exact combination an `npm i @dsh-feishu/dsh-feishu` user gets. dsh-feishu's
# npm @latest release tracks dsh @latest (rc.7), while main tracks dsh @next
# (rc.8; see docs/development.md → "Publishing" → "Version tracks"); the two
# tracks are verified separately by this workflow and the Canary workflow.
#
# NOTE: this installs the PUBLISHED package, not the repo — main's code
# targets dsh @next and is not expected to compile against @latest. The dsh
# CLI bundles its own sub-packages, so only the top-level dsh package is
# installed by @latest (the npm `latest` tags of the @deepseek-ai/* sub-
# packages are stale 0.0.1-rc.x lines whose peers were never published).
#
# Triggered on a schedule (UTC 04:00, i.e. 12:00 Beijing) and manually via
# workflow_dispatch.

on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

jobs:
  release-compat:
    name: published npm package against dsh@latest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install published package + dsh@latest (the real user combo)
        run: |
          mkdir -p /tmp/compat && cd /tmp/compat
          npm init -y
          npm install @dsh-feishu/dsh-feishu@latest @deepseek-ai/dsh@latest

      - name: Verify the package resolves
        run: |
          cd /tmp/compat
          node -e "const p=require('@dsh-feishu/dsh-feishu/package.json'); console.log('@dsh-feishu/dsh-feishu', p.version)"
          node -e "const p=require('@deepseek-ai/dsh/package.json'); console.log('@deepseek-ai/dsh', p.version)"

      - name: Boot the published bundle against dsh@latest
        # Mount the published package into a scratch profile, then dump the
        # composed config and confirm the feishu bundle row is present — the
        # bundle loads and composes without throwing.
        run: |
          cd /tmp/compat
          export DSH_HOME=/tmp/compat/dsh-home
          ./node_modules/.bin/dsh plugin --profile compat add "link:/tmp/compat/node_modules/@dsh-feishu/dsh-feishu"
          timeout 60 ./node_modules/.bin/dsh --profile compat --dump-config 2>&1 | grep -q "name: '@dsh-feishu/dsh-feishu'" \
            || { echo 'feishu bundle missing from composed config'; exit 1; }
