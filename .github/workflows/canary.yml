name: Canary (main vs dsh@latest)

# Daily check that `main` stays adapted to the dsh version users actually get
# from the npm `@latest` tag — the only compatibility promise this repo makes
# (see docs/development.md → "Version tracks"). When upstream moves `@latest`,
# this workflow pins the CLI to it, re-resolves the family exactly the way a
# user's `npm i @deepseek-ai/dsh@latest` does, and runs the full gates. A red
# run means main needs a real compatibility fix (0.1.5: the in-flight
# `assistant/chunk` session event moved to `agent/assistant-stream`).
#
# Triggered on a schedule (UTC 02:00, i.e. 10:00 Beijing) and manually via
# workflow_dispatch.

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  canary:
    name: unit + integration against dsh@latest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # Emulate the user's install: the npm `@latest` CLI plus the caret
      # resolution that CLI declares for the rest of the family. Only the dsh
      # CLI carries a meaningful npm `latest` tag — the sub-packages still
      # publish `latest` on ancient 0.0.1-rc.x lines — so every harness
      # dependency is set to the caret of the CLI's `@latest` version instead
      # of being pointed at a dist-tag. Nothing here is committed; the point is
      # to test the combination a user gets.
      - name: Pin the dsh family to the npm @latest CLI (not frozen)
        run: |
          VERSION="$(npm view @deepseek-ai/dsh@latest version)"
          echo "dsh @latest = ${VERSION}"
          V="${VERSION}" node -e "
            const fs = require('node:fs');
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            const version = process.env.V;
            for (const section of ['devDependencies', 'peerDependencies']) {
              for (const name of Object.keys(pkg[section] ?? {})) {
                if (!name.startsWith('@deepseek-ai/')) continue;
                // cordis / schemastery are versioned independently (4.x / 3.x).
                if (name === '@deepseek-ai/cordis' || name === '@deepseek-ai/schemastery') continue;
                const cli = name === '@deepseek-ai/dsh';
                pkg[section][name] = cli ? version : '^' + version;
              }
            }
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          "
          pnpm install --no-frozen-lockfile
          pnpm dedupe

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      - name: Build
        run: pnpm run build

      # Same integration profile preparation as ci.yml; DSH_BIN is the
      # freshly installed newest CLI. Each integration suite gets its OWN
      # dsh home (parallel suites racing session-map.json writes — see
      # ci.yml).
      - name: Prepare integration-test profiles
        env:
          DSH_HOME: ${{ github.workspace }}/_dev/dsh-home-attachments
        run: pnpm exec dsh plugin --profile feishu-dev add "link:${{ github.workspace }}"
      - name: Prepare integration-test profile (rich-text)
        env:
          DSH_HOME: ${{ github.workspace }}/_dev/dsh-home-rich-text
        run: pnpm exec dsh plugin --profile feishu-dev add "link:${{ github.workspace }}"
      - name: Prepare integration-test profile (wait-instruction)
        env:
          DSH_HOME: ${{ github.workspace }}/_dev/dsh-home-wait-instruction
        run: pnpm exec dsh plugin --profile feishu-dev add "link:${{ github.workspace }}"
      - name: Prepare integration-test profile (real-composition)
        env:
          DSH_HOME: ${{ github.workspace }}/_dev/dsh-home-real
        run: pnpm exec dsh plugin --profile feishu-dev add "link:${{ github.workspace }}"
      - name: Prepare integration-test profile (outbound)
        env:
          DSH_HOME: ${{ github.workspace }}/_dev/dsh-home-outbound
        run: pnpm exec dsh plugin --profile feishu-dev add "link:${{ github.workspace }}"
      - name: Prepare integration-test profile (turn-produced-files)
        env:
          DSH_HOME: ${{ github.workspace }}/_dev/dsh-home-turn-produced-files
        run: pnpm exec dsh plugin --profile feishu-dev add "link:${{ github.workspace }}"
      - name: Prepare scenario integration-test profile
        env:
          DSH_HOME: ${{ github.workspace }}/_dev/dsh-home-scenarios
        run: pnpm exec dsh plugin --profile feishu-dev add "link:${{ github.workspace }}"

      - name: Test (unit + integration, FEISHU_INT_REQUIRED)
        env:
          DSH_BIN: ${{ github.workspace }}/node_modules/.bin/dsh
          FEISHU_INT_REQUIRED: '1'
        run: pnpm run test
