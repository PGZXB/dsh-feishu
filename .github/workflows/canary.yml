name: Canary (main vs dsh@next)

# Daily check that `main` stays adapted to the NEWEST @deepseek-ai/dsh
# pre-release (@next dist-tag). main deliberately tracks @next (the npm
# `latest` tag is reserved for the stable release line) — when upstream
# publishes a newer @next (rc.9, …), this workflow lifts the whole dsh
# family to it and runs the full gates against the fresh CLI. A red run
# means main needs a compatibility fix for the newest dsh (e.g. rc.8's
# commands.execute gained an images parameter).
#
# Triggered on a schedule (UTC 02:00, i.e. 10:00 Beijing) and manually via
# workflow_dispatch.

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  canary:
    name: unit + integration against dsh@next
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # Lift EVERY dsh-family dependency to the newest @next pre-release
      # (not the lockfile-pinned one — main's lockfile may be a release
      # behind @next when upstream publishes faster than we adapt). The dsh
      # CLI bundles its sub-packages, but our direct dev/peer/runtime deps
      # must be lifted too.
      - name: Install with newest dsh (@next, not frozen)
        run: |
          pnpm add -D @deepseek-ai/dsh@next \
            @deepseek-ai/dsh-agent@next @deepseek-ai/dsh-llm@next \
            @deepseek-ai/dsh-session@next \
            @deepseek-ai/dsh-user-approval@next \
            @deepseek-ai/dsh-user-questions@next \
            @deepseek-ai/dsh-credentials@next \
            @deepseek-ai/dsh-commands@next @deepseek-ai/dsh-schedule@next
          pnpm install --no-frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      - name: Build
        run: pnpm run build

      # Same integration profile preparation as ci.yml; DSH_BIN is the
      # freshly installed newest CLI. Each integration suite gets its OWN
      # dsh home (parallel suites racing session-map.json writes — see
      # ci.yml).
      - name: Prepare integration-test profiles
        env:
          DSH_HOME: ${{ github.workspace }}/_dev/dsh-home-attachments
        run: pnpm exec dsh plugin --profile feishu-dev add "link:${{ github.workspace }}"
      - name: Prepare integration-test profile (rich-text)
        env:
          DSH_HOME: ${{ github.workspace }}/_dev/dsh-home-rich-text
        run: pnpm exec dsh plugin --profile feishu-dev add "link:${{ github.workspace }}"
      - name: Prepare integration-test profile (wait-instruction)
        env:
          DSH_HOME: ${{ github.workspace }}/_dev/dsh-home-wait-instruction
        run: pnpm exec dsh plugin --profile feishu-dev add "link:${{ github.workspace }}"
      - name: Prepare integration-test profile (real-composition)
        env:
          DSH_HOME: ${{ github.workspace }}/_dev/dsh-home-real
        run: pnpm exec dsh plugin --profile feishu-dev add "link:${{ github.workspace }}"
      - name: Prepare integration-test profile (outbound)
        env:
          DSH_HOME: ${{ github.workspace }}/_dev/dsh-home-outbound
        run: pnpm exec dsh plugin --profile feishu-dev add "link:${{ github.workspace }}"
      - name: Prepare scenario integration-test profile
        env:
          DSH_HOME: ${{ github.workspace }}/_dev/dsh-home-scenarios
        run: pnpm exec dsh plugin --profile feishu-dev add "link:${{ github.workspace }}"

      - name: Test (unit + integration, FEISHU_INT_REQUIRED)
        env:
          DSH_BIN: ${{ github.workspace }}/node_modules/.bin/dsh
          FEISHU_INT_REQUIRED: '1'
        run: pnpm run test
