name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  gates:
    name: lint / typecheck / build / test (unit + integration)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      # The integration suite boots a real dsh process from the checkout's
      # built lib/, so Build must land before Test.
      - name: Build
        run: pnpm run build

      # Feishu is mocked via FEISHU_TRANSPORT=memory and the LLM via a local
      # mock server — no real credentials are needed. The profile links the
      # checkout; see docs/development.md → "Integration test".
      - name: Prepare integration-test profile
        env:
          DSH_HOME: ${{ github.workspace }}/_dev/dsh-home
        run: pnpm exec dsh plugin --profile feishu-dev add "link:${{ github.workspace }}"

      # FEISHU_INT_REQUIRED turns a missing prerequisite (dsh CLI, profile,
      # build) into a hard failure instead of the local graceful skip.
      - name: Test (unit + integration)
        env:
          DSH_BIN: ${{ github.workspace }}/node_modules/.bin/dsh
          FEISHU_INT_REQUIRED: '1'
        run: pnpm run test
