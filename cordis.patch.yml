# @dsh-feishu/dsh-feishu bundle patch: the Feishu (Lark) surface over the
# dsh-base layer. Applied after dsh-base's insert; rows here override base
# rows by id, with the profile's own cordis.patch.yml and any --patch
# overlays still to come.
#
# Iteration 0: mount only the bridge entry point. It starts in "not
# configured" mode until credentials are supplied (via the appId/appSecret
# config keys or the FEISHU_APP_ID / FEISHU_APP_SECRET environment
# variables), so the bundle is safe to add to any profile without
# credentials. The Feishu transport, session bridge, and streaming cards
# arrive in later iterations.
- insert:
    - id: feishu
      name: '@dsh-feishu/dsh-feishu'

    # Parity with the web surface (its standard/code agent presets mount
    # this tool): the model can ask the user questions on Feishu, rendered
    # as question cards by the surface's userQuestions provider. The tool
    # needs `tools` + `userQuestions`, both mounted by dsh-base above.
    - id: tool-ask-user
      name: '@deepseek-ai/dsh-tool-ask-user'

    # The next three rows exist for one reason: reminders are a shipped
    # feature, and dsh 0.1.7 re-parented `dsh-schedule` onto the session
    # business API — schedule needs `sessionController` (row 3), which needs
    # `fileUploads` (row 2), which needs `connection` (row 1). dsh-base mounts
    # neither of the three, and a missing link leaves the whole chain
    # `pending`: the reminder tools never register and the agent's calls fail
    # with `unknown tool "schedule_create"`. Do not prune them as unrelated to
    # a Feishu surface — with them gone, reminders are gone.
    #
    # Client-connection service (`connection`), which the upload bundle below
    # injects; part of the same 0.1.7 chain that `dsh-schedule` now needs.
    - id: client-connection
      name: '@deepseek-ai/dsh-client-connection'

    # Host storage/staged-receipt service for uploads. dsh 0.1.7's
    # `api-session-controller` below injects `fileUploads`, which only this
    # bundle provides; without it the controller stays pending and the
    # reminder scheduler never activates (`unknown tool "schedule_create"`).
    # It injects nothing itself, so it is the root of this chain.
    - id: client-file-upload
      name: '@deepseek-ai/dsh-client-file-upload'

    # The Session business API owner. dsh 0.1.7's `dsh-schedule` injects
    # `sessionController`, which only this bundle provides — without it the
    # schedule row below stays `pending (waiting for service:
    # sessionController)` and registers no tools (the agent's create/list
    # calls fail with an unknown tool). dsh-base mounts `api-gateway` but
    # not this controller.
    - id: api-session-controller
      name: '@deepseek-ai/dsh-api-session-controller'

    # Agent-scoped durable reminders (after / at / every): the model creates
    # them in chat ("remind me in 5 minutes"), and a fired reminder wakes the
    # agent, whose response the surface renders as an '⏰ Reminder' card
    # (agent-initiated turn path in the bridge). dsh-base does not mount it.
    - id: schedule
      name: '@deepseek-ai/dsh-schedule'

    # Durable workspace registry (session archive/restore, web-visible).
    # The workspace registry persists through the storage domain, so a
    # rename/archive on Feishu is observed by the dsh web UI sharing the
    # same DSH_HOME, and vice versa. dsh-base @0.1.2-rc.1 already mounts the
    # storage ×3 domain core (storage / storage-json / storage-domain) with
    # the same config, so only the `workspace` bundle row is added here.
    - id: workspace
      name: '@deepseek-ai/dsh-workspace'
